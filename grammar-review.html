<header><div class="kicker">IELTS WRITING LAB · GRAMMAR REVIEW</div><h1>复核句型训练 <small style="font-size:15px;opacity:.7">v1.4.0</small></h1><p class="sub">从真实写作错误出发：语法规则 → 搭配填空 → 整句纠错 → 中译英 → 主体段迁移。目标 Band 7.5+ 的准确输出，而非死背范文。</p></header>
<div class="wrap"><aside class="side" id="sidebar"><h2>12 个专项课程</h2><select id="mobileLesson" aria-label="选择语法专题"></select><div id="lessonBtns"></div><div style="border-top:1px solid var(--line);padding-top:9px;width:100%"><button id="reviewBtn">待复习错题</button><button id="progressBtn">学习进度与备份</button></div></aside>
<main class="main"><div id="content"></div><p class="footer">仅供学习自测；填空题按参考答案核对，整句纠错与翻译需要人工比较语义和语法，合理的同义答案不应视为错误。学习进度保存在此浏览器内。</p></main></div>

          "explanation": "not essential 与 makes no difference 不等同。",

          "type": "mini",
          "prompt": "写两句讨论AI影响工作，必须含 may 和 however，避免绝对判断。",

          "answer": "AI may displace some workers in routine occupations. However, retraining programmes can help affected employees move into new roles.",

}</script><script>
'use strict';const DATA=JSON.parse(document.getElementById('grammarData').textContent),KEY='ielts-grammar-review-v1.4';let state={};let storageOK=true;try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){storageOK=false}let section='lesson',activeId=DATA.lessons[0].id,filter='all';const $=id=>document.getElementById(id);const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const getQ=(l)=>l.exercises;const allQ=()=>DATA.lessons.flatMap(l=>getQ(l));const sum=()=>({all:allQ().length,attempted:Object.values(state).filter(x=>x.answered).length,review:Object.values(state).filter(x=>x.status==='review').length,mastered:Object.values(state).filter(x=>x.status==='mastered').length});
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}}function norm(s){return String(s||'').trim().toLowerCase().replace(/[.,!?;:]+$/,'').replace(/\s+/g,' ').replace(/’/g,"'")}
function oneDay(n){return new Date(Date.now()+n*86400000).toISOString()};function update(id,o){const was=state[id]||{};state[id]={...was,...o};persist()}
function record(id,kind,verdict=null){const p=state[id]||{};let n=verdict===false?0:(p.success||0)+(verdict===true?1:0);update(id,{answered:true,last:new Date().toISOString(),status:verdict===true?'mastered':verdict===false?'review':p.status||'review',success:n,next:oneDay(verdict===true?(n>=3?7:n===2?3:1):1)});refreshSidebar()}
function refreshSidebar(){const summary=sum();$('mobileLesson').innerHTML=DATA.lessons.map((l,i)=>`<option value="${esc(l.id)}">${i+1}. ${esc(l.title)}</option>`).join('');$('mobileLesson').value=activeId;$('lessonBtns').innerHTML=DATA.lessons.map((l,i)=>{const progress=l.exercises.filter(q=>state[q.id]?.answered).length;return `<button data-lesson="${esc(l.id)}" class="${section==='lesson'&&activeId===l.id?'active':''}">${i+1}. ${esc(l.title)}<span>${progress}/${l.exercises.length} 题 · ${l.priority}</span></button>`}).join('');$('reviewBtn').classList.toggle('active',section==='review');$('progressBtn').classList.toggle('active',section==='progress')}
function openLesson(id){section='lesson';activeId=id;render();window.scrollTo(0,0)}function render(){refreshSidebar();if(section==='lesson')renderLesson();else if(section==='review')renderReview();else renderProgress()}
function typeName(t){return ({gap:'① 重点填空',correct:'② 整句纠错',translate:'③ 中译英',mini:'④ 主体段迁移'})[t]||t}
function exerciseCard(q,idx){const prev=state[q.id]||{},isFill=q.type==='gap';return `<div class="exercise" data-id="${esc(q.id)}"><div class="row spread"><span class="type">${typeName(q.type)} · ${idx+1}</span><span class="mark ${prev.status==='mastered'?'good':prev.status==='review'?'bad':''}">${prev.status==='mastered'?'已掌握':prev.status==='review'?'需复习':''}</span></div><div class="prompt">${esc(q.prompt)}</div>${isFill?`<input type="text" data-draft="${esc(q.id)}" autocomplete="off" placeholder="输入缺失的词或搭配">`:`<textarea data-draft="${esc(q.id)}" placeholder="先自己写完整英文句子，再看参考答案。"></textarea>`}<div class="tool"><button class="primary" data-action="check" data-id="${esc(q.id)}">${isFill?'检查填空':'显示参考答案'}</button><button data-action="review" data-id="${esc(q.id)}">标记需复习</button><button data-action="master" data-id="${esc(q.id)}">标记已掌握</button></div><div class="answer" id="answer-${esc(q.id)}"><div class="small"><b>参考：</b> ${esc(q.answer)}</div><div class="note">解析：${esc(q.explanation||DATA.lessons.find(l=>l.exercises.some(x=>x.id===q.id)).note)}</div><div class="note">${isFill?'填空自动核对词形；有同义词可人工判断。':'请人工检查：主谓结构、介词、词形和原意是否一致。'}</div></div></div>`}
function renderLesson(){const l=DATA.lessons.find(x=>x.id===activeId)||DATA.lessons[0];const st=sum();$('content').innerHTML=`<div class="card"><div class="row spread"><div><span class="chip ${l.priority==='P1'?'critical':''}">${l.priority} · ${l.frequency}</span><h2>${esc(l.title)}</h2></div><span class="chip">${l.exercises.length} 道练习</span></div><div class="rule">${esc(l.note)}</div><div class="pair"><div class="error"><b>曾出现的错误</b><div>${esc(l.wrong)}</div></div><div class="correct"><b>建议正确表达</b><div>${esc(l.right)}</div></div></div><h3>建议背诵的固定结构</h3><div>${l.patterns.map(p=>`<span class="pattern">${esc(p)}</span>`).join('')}</div><p class="muted small" style="margin:12px 0 0">完成顺序：填空 4 → 纠错 2 → 中译英 2 → 段落迁移 1。每题作答后可检查并加入复习队列。</p></div><div class="card"><div class="row spread"><h2>专项练习</h2><span class="muted small">答错题自动进入复习队列</span></div><div id="exerciseList">${l.exercises.map(exerciseCard).join('')}</div></div>`;wireExercises()}
function wireExercises(){document.querySelectorAll('[data-draft]').forEach(el=>{const id=el.dataset.draft;el.value=state[id]?.draft||'';el.addEventListener('input',()=>{update(id,{draft:el.value})})});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const id=b.dataset.id,q=allQ().find(x=>x.id===id),val=document.querySelector(`[data-draft="${id}"]`)?.value||'',ans=$('answer-'+id),act=b.dataset.action;if(act==='check'){ans.classList.add('visible');if(q.type==='gap'){let okay=q.accepted.some(x=>norm(x)===norm(val));record(id,'gap',okay);ans.querySelector('.checking-status')?.remove();ans.insertAdjacentHTML('beforeend',`<p class="checking-status note ${okay?'mark good':'mark bad'}">${okay?'✓ 与参考匹配':'请再核对：'+esc(q.answer)}</p>`)}else{record(id,q.type,null)}}else if(act==='review'){record(id,q.type,false);ans.classList.add('visible')}else if(act==='master'){record(id,q.type,true);ans.classList.add('visible')}const label=b.closest('.exercise').querySelector('.mark');if(label){label.textContent=state[id]?.status==='mastered'?'已掌握':'需复习';label.className='mark '+(state[id]?.status==='mastered'?'good':'bad')}})}
function renderReview(){const now=Date.now(),qs=allQ().filter(q=>state[q.id]?.status==='review');const due=qs.filter(q=>!state[q.id]?.next||new Date(state[q.id].next).getTime()<=now);$('content').innerHTML=`<div class="card"><h2>个人错题回收</h2><p class="muted">共 ${qs.length} 道待复习，其中 ${due.length} 道已到复习日期。做错时明天回收，连续掌握后将间隔逐渐延长。你也可以手动标记已掌握。</p><div class="row"><button class="${filter==='all'?'primary':''}" id="filterAll">全部待复习</button><button class="${filter==='due'?'primary':''}" id="filterDue">今日到期</button></div></div><div class="card" id="reviewList">${(filter==='due'?due:qs).length?(filter==='due'?due:qs).map((q,i)=>exerciseCard(q,i)).join(''):'<p class="muted">当前没有待复习题目。先完成课程练习，做错的题会出现在这里。</p>'}</div>`;$('filterAll').onclick=()=>{filter='all';renderReview()};$('filterDue').onclick=()=>{filter='due';renderReview()};wireExercises()}
function download(s,filename){const a=document.createElement('a');let u=URL.createObjectURL(new Blob([s],{type:'application/json;charset=utf-8'}));a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function renderProgress(){const st=sum();$('content').innerHTML=`<div class="card"><h2>学习进度与数据备份</h2><div class="stat-grid"><div class="stat"><strong>${st.attempted}/${st.all}</strong><span class="small">已完成题目</span></div><div class="stat"><strong>${st.mastered}</strong><span class="small">已掌握</span></div><div class="stat"><strong>${st.review}</strong><span class="small">需复习</span></div></div><div class="bar" style="margin-top:14px"><span style="width:${Math.round(100*st.attempted/st.all)}%"></span></div><div class="tool export"><button class="primary" id="exportBtn">导出 JSON 学习记录</button><label class="chip" style="cursor:pointer">导入学习记录 <input id="importInput" type="file" accept="application/json" style="display:none"></label></div><p class="reminder">提醒：文件升级或浏览器清除数据可能影响本地记录。定期导出 JSON 保存到安全位置，新版本可继续导入。</p><h3>课程进度</h3>${DATA.lessons.map(l=>`<div class="item row spread"><span>${esc(l.title)}</span><span class="muted small">${l.exercises.filter(q=>state[q.id]?.answered).length}/${l.exercises.length}</span></div>`).join('')}</div>`;$('exportBtn').onclick=()=>download(JSON.stringify({version:'1.4.0',exported:new Date().toISOString(),state},null,2),'IELTS_Grammar_Review_Progress.json');$('importInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(typeof j.state!=='object'||!j.state||Array.isArray(j.state))throw Error('JSON格式不正确');state=j.state;persist();render();alert('已导入学习记录')}catch(err){alert('导入失败：'+err.message)}};rd.readAsText(f)}}
$('sidebar').addEventListener('click',e=>{let b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)});$('mobileLesson').onchange=e=>openLesson(e.target.value);$('reviewBtn').onclick=()=>{section='review';render();window.scrollTo(0,0)};$('progressBtn').onclick=()=>{section='progress';render();window.scrollTo(0,0)};render();
</script></body></html>
